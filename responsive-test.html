<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#ddd}iframe{display:block;border:0;width:390px;height:2650px}pre{font:12px monospace}</style></head><body><iframe src="../wwwroot/index.html"></iframe><pre id="result"></pre><script>document.querySelector('iframe').onload=async()=>{const frame=document.querySelector('iframe'),w=frame.contentWindow,results=[];for(const size of [320,390,768,1280]){frame.style.width=size+'px';await new Promise(r=>setTimeout(r,50));results.push({viewport:w.innerWidth,content:w.document.documentElement.scrollWidth,pass:w.innerWidth===w.document.documentElement.scrollWidth});}frame.style.width='390px';document.querySelector('#result').textContent=JSON.stringify(results);};</script></body></html>
