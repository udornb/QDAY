<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>จัดการร้าน — ละมุน</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body data-page="admin"><header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">ล</span><span>ละมุน<span class="brand-sub">FOR BUSINESS</span></span></a><nav><a href="index.html">↗ ดูหน้าร้าน</a><button id="logout" class="secondary" hidden>ออกจากระบบ</button></nav></header><main class="page-shell admin-shell"><div id="admin-content"></div></main><dialog id="booking-dialog"><div class="dialog-header"><h2 id="dialog-title">เพิ่มคิว</h2><button class="icon-button" id="close-dialog" aria-label="ปิด">×</button></div><form id="admin-booking-form" class="form-grid"><input name="id" type="hidden"><label>ชื่อลูกค้า<input name="name" required maxlength="80"></label><label>เบอร์โทรศัพท์<input name="phone" type="tel" required pattern="[0-9+() -]{8,20}"></label><label>บริการ<select name="service"><option>ตัดผม</option><option>ทำสีผม</option><option>สระและจัดแต่งทรง</option><option>ทรีตเมนต์</option></select></label><label>วันที่<input name="date" type="date" required></label><label>เวลา<select name="time" required></select></label><label class="full-width">หมายเหตุ<textarea name="note" maxlength="500"></textarea></label><p class="form-error full-width" role="alert"></p><button class="button full-width">บันทึกคิว</button></form></dialog><div id="toast" role="status"></div></body></html>
